</style><main><div class="eyebrow">SMALL STEPS, EVERY DAY</div><h1>작은 실행이<br>나를 바꾸는 중.</h1><p>거창하지 않아도 괜찮아요. 오늘의 작은 실행을 한 칸씩 쌓아보세요.</p><div class="devicebar"><span>화면 구성</span><select id="deviceMode" aria-label="화면 구성"><option value="auto">자동 감지</option><option value="pc">PC</option><option value="tablet">태블릿</option><option value="mobile">모바일</option></select><span id="deviceLabel"></span></div><div class="stats" id="stats"></div><div class="toolbar datebar"><select id="year" aria-label="기록 연도"></select><input id="date" type="date" aria-label="기록할 날짜"><button id="today">오늘</button><button class="primary iconplus" id="add" aria-label="할 일 추가" title="할 일 추가"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button></div><div class="viewtools"><div class="periodnav"><button id="prevPeriod" aria-label="이전 기간">‹</button><span id="periodLabel"></span><button id="nextPeriod" aria-label="다음 기간">›</button></div><div class="viewbuttons" role="group" aria-label="기간 보기"><button data-view="month">월</button><button data-view="quarter">분기</button><button data-view="year" class="active">년</button></div></div><div class="tiny muted selecthelp">클릭: 날짜 선택 · Shift: 연속 선택 · Ctrl / ⌘: 여러 날짜 선택 · 우클릭: 해당 할 일의 선택 날짜 기록 취소</div><div class="selectionbar"><span id="selectionInfo"></span><button id="clearSelection">선택 해제</button><label class="multi-toggle"><input type="checkbox" id="multiMode"> 다중 선택</label></div><section id="list"></section><div class="toolbar"><button id="backup">백업 저장</button><button id="restore">백업 불러오기</button><button id="portable">기록 포함 HTML 저장</button><button onclick="window.print()">인쇄 / PDF</button><input id="file" type="file" accept="application/json,.json" hidden></div><footer id="storage">기록은 이 브라우저에 자동저장됩니다. 기기 간 이동이나 파일 변경 전에는 백업해 주세요.</footer></main><dialog id="editor"><form id="form"><h2 id="dialogTitle">새로운 작은 실행</h2><input id="hid" type="hidden"><label>할 일 이름<input id="name" maxlength="70" required placeholder="예: 책 2쪽 읽기"></label><label>작게 시작할 기준<input id="desc" maxlength="100" placeholder="예: 잠들기 전 5분만"></label><label>하루 목표 실행 횟수<input id="goal" type="number" min="1" max="10000" value="1" required></label><label>나만의 색상<input id="color" type="color" value="#95c9f0"></label><div class="toolbar"><button type="submit" class="primary">저장</button><button type="button" id="cancel">취소</button><button type="button" id="delete" style="color:#ffacac">삭제</button></div></form></dialog><div id="toast" role="status"></div><script id="seed" type="application/json">null</script><script>
const $=s=>document.querySelector(s),KEY='small-steps-v1',palette=['#95c9f0','#f4ce91','#f1a5b4','#89cfca','#b6b0eb'];const day=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),now=day(new Date());let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!valid(data)){try{data=JSON.parse($('#seed').textContent)}catch{}}if(!valid(data))data={version:1,habits:['물 한 잔 마시기','몸 3분 움직이기','책 2쪽 읽기'].map((name,i)=>({id:crypto.randomUUID(),name,desc:['일어나서 한 잔부터','편안한 범위에서 가볍게','하루 두 쪽이면 충분해요'][i],goal:1,color:palette[i],logs:{}}))};
function valid(d){return d&&d.version===1&&Array.isArray(d.habits)&&d.habits.length<=200&&d.habits.every(h=>typeof h.id==='string'&&typeof h.name==='string'&&typeof h.desc==='string'&&/^#[0-9a-f]{6}$/i.test(h.color)&&Number.isInteger(h.goal)&&h.goal>0&&h.goal<=10000&&h.logs&&typeof h.logs==='object'&&!Array.isArray(h.logs)&&Object.entries(h.logs).every(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Number.isInteger(v)&&v>=0&&v<=1000000))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{$('#storage').textContent='자동저장이 제한된 환경입니다. 기록 포함 HTML 또는 백업을 저장해 주세요.'}render()}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2200)}
function years(){let y=+$('#year').value||+now.slice(0,4);let arr=new Set([y,+now.slice(0,4)-1,+now.slice(0,4),+now.slice(0,4)+1]);data.habits.forEach(h=>Object.keys(h.logs).forEach(d=>arr.add(+d.slice(0,4))));$('#year').replaceChildren(...[...arr].sort().map(n=>new Option(n+'년',n,false,n===y)))}
let collapsedCards=new Set(),initializedCards=new Set(),deviceMode='auto';try{deviceMode=localStorage.getItem('small-steps-device')||'auto'}catch{}function applyDevice(){const d=deviceMode==='auto'?(innerWidth<640?'mobile':innerWidth<1100?'tablet':'pc'):deviceMode;document.body.dataset.device=d;$('#deviceLabel').textContent={pc:'PC 화면',tablet:'태블릿 화면',mobile:'모바일 화면'}[d];$('#deviceMode').value=deviceMode}applyDevice();$('#deviceMode').onchange=e=>{deviceMode=e.target.value;try{localStorage.setItem('small-steps-device',deviceMode)}catch{}applyDevice();render()};window.addEventListener('resize',()=>{let old=document.body.dataset.device;applyDevice();if(old!==document.body.dataset.device)render()});
let selectedDates=new Set([now]),anchorDate=now,viewMode='year';
function selectDate(d,e={}){if(d>now)return toast('미래 날짜는 선택할 수 없어요.');if(e.shiftKey&&anchorDate){let a=anchorDate<d?anchorDate:d,b=anchorDate<d?d:anchorDate;if(!e.ctrlKey&&!e.metaKey)selectedDates.clear();for(let t=new Date(a+'T12:00:00');day(t)<=b;t.setDate(t.getDate()+1))selectedDates.add(day(t))}else if(e.ctrlKey||e.metaKey||$('#multiMode').checked){selectedDates.has(d)?selectedDates.delete(d):selectedDates.add(d);anchorDate=d}else{selectedDates=new Set([d]);anchorDate=d}$('#date').value=d;render()}
function periodBounds(){const y=+$('#year').value,m=+$('#date').value.slice(5,7)-1;let start=new Date(y,0,1),end=new Date(y+1,0,1),label=y+'년';if(viewMode==='month'){start=new Date(y,m,1);end=new Date(y,m+1,1);label=y+'년 '+(m+1)+'월'}if(viewMode==='quarter'){let q=Math.floor(m/3);start=new Date(y,q*3,1);end=new Date(y,q*3+3,1);label=y+'년 '+(q+1)+'분기 · '+(q*3+1)+'–'+(q*3+3)+'월'}return {start,end,label}}
$('#date').value=now;$('#date').max=now;years();
function render(){years();const y=+$('#year').value,selected=$('#date').value,{start,end,label}=periodBounds();$('#periodLabel').textContent=label;$('#selectionInfo').textContent=selectedDates.size?selectedDates.size+'개 날짜 선택 · + / − 버튼으로 일괄 기록':'선택된 날짜 없음';$('#selectionInfo').dataset.mobile=selectedDates.size?selectedDates.size+'일 선택됨':'날짜를 선택하세요';document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===viewMode);b.setAttribute('aria-pressed',b.dataset.view===viewMode)});let total=0,active=new Set(),done=0;data.habits.forEach(h=>{Object.entries(h.logs).forEach(([d,v])=>{if(d.startsWith(y+'')&&v){total+=v;active.add(d)}});if((h.logs[selected]||0)>=h.goal)done++});$('#stats').innerHTML=`<div class="stat"><b>${total.toLocaleString()}</b><span>${y}년 누적 실행</span></div><div class="stat"><b>${active.size}</b><span>실행한 날짜</span></div><div class="stat"><b>${done}/${data.habits.length}</b><span>선택한 날 목표 달성</span></div>`;$('#list').replaceChildren();data.habits.forEach((h,habitIndex)=>{let entries=Object.entries(h.logs).filter(([d,v])=>d.startsWith(y+'')&&v>0),sum=entries.reduce((a,[d,v])=>a+v,0),count=h.logs[selected]||0;const card=document.createElement('article');card.className='card';card.style.setProperty('--c',h.color);card.innerHTML='<div class="head"><button class="heading goal-toggle" type="button"><span class="title"></span><span class="sub"></span><span class="chevron" aria-hidden="true">⌄</span></button><div class="actions"><button class="minus" aria-label="실행 1회 취소">−</button><button class="plus iconplus" aria-label="실행 1회 추가" title="실행 1회 추가"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button><button class="more" aria-label="할 일 수정">⋯</button></div></div><div class="gridwrap"><div class="grid"></div><div class="compactyear"></div></div><div class="foot"><span class="summary"></span><span class="daily"><span class="record-date"></span><b class="record-count"></b></span></div><div class="progress"><i></i></div>';if(document.body.dataset.device!=='pc'&&!initializedCards.has(h.id)){initializedCards.add(h.id);if(habitIndex>0)collapsedCards.add(h.id)}card.classList.toggle('collapsed',collapsedCards.has(h.id));const goalToggle=card.querySelector('.goal-toggle');goalToggle.setAttribute('aria-expanded',!collapsedCards.has(h.id));goalToggle.onclick=()=>{if(document.body.dataset.device==='pc')return;collapsedCards.has(h.id)?collapsedCards.delete(h.id):collapsedCards.add(h.id);render()};card.querySelector('.title').textContent=h.name;card.querySelector('.sub').textContent=(h.desc?h.desc+' · ':'')+'하루 '+h.goal+'회';card.querySelector('.summary').textContent='누적 '+sum.toLocaleString()+'회 · '+entries.length+'일 실행';card.querySelector('.record-date').textContent=selectedDates.size>1?selectedDates.size+'개 날짜 선택':selectedDates.size?selected.replaceAll('-','.'):'날짜 선택 없음';card.querySelector('.record-count').textContent=selectedDates.size>1?'합계 '+[...selectedDates].reduce((a,d)=>a+(h.logs[d]||0),0)+'회':count+' / '+h.goal+'회';card.querySelector('i').style.width=Math.min(100,count/h.goal*100)+'%';const change=n=>{const ds=[...selectedDates].filter(d=>d<=now);if(!ds.length)return toast('먼저 날짜를 선택해 주세요.');ds.forEach(d=>{h.logs[d]=Math.max(0,(h.logs[d]||0)+n);if(!h.logs[d])delete h.logs[d]});save()};card.querySelector('.plus').onclick=()=>change(1);card.querySelector('.minus').onclick=()=>change(-1);card.querySelector('.more').onclick=()=>edit(h);const grid=card.querySelector('.grid');grid.classList.toggle('month-grid',viewMode==='month');grid.style.setProperty('--weeks',Math.ceil((start.getDay()+Math.round((end-start)/86400000))/7));for(let i=0;i<start.getDay();i++)grid.append(document.createElement('span'));for(let dt=new Date(start);dt<end;dt.setDate(dt.getDate()+1)){const d=day(dt),v=h.logs[d]||0,b=document.createElement('button');b.className='cell'+(v?' filled':'')+(d>now?' future':'')+(selectedDates.has(d)?' selected':'');if(v)b.style.opacity=.35+.65*Math.min(1,v/h.goal);b.title=d+' · '+v+'회';b.setAttribute('aria-label',h.name+' '+b.title);b.setAttribute('aria-pressed',selectedDates.has(d));b.dataset.date=d;b.dataset.day=dt.getDate();b.onclick=e=>selectDate(d,e);b.oncontextmenu=e=>{e.preventDefault();if(d>now)return;if(!selectedDates.has(d)){selectedDates=new Set([d]);anchorDate=d;$('#date').value=d}const ds=[...selectedDates].filter(v=>v<=now);ds.forEach(v=>delete h.logs[v]);save();toast(ds.length+'개 날짜의 기록을 취소했어요.')};grid.append(b)}const annual=card.querySelector('.compactyear');card.classList.toggle('annual-view',viewMode==='year');if(viewMode==='year'){const cells=new Map([...grid.querySelectorAll('[data-date]')].map(b=>[b.dataset.date,b]));for(let month=0;month<12;month++){const mini=document.createElement('div');mini.className='mini-month';const title=document.createElement('div');title.className='month-title';title.textContent=(month+1)+'월';mini.append(title);const mg=document.createElement('div');mg.className='month-days';for(const w of ['일','월','화','수','목','금','토']){const label=document.createElement('span');label.className='weekday';label.textContent=w;mg.append(label)}const ms=new Date(y,month,1),me=new Date(y,month+1,1);for(let n=0;n<ms.getDay();n++)mg.append(document.createElement('span'));for(let dt=new Date(ms);dt<me;dt.setDate(dt.getDate()+1)){const source=cells.get(day(dt));if(source){const b=source.cloneNode(true);b.onclick=source.onclick;b.oncontextmenu=source.oncontextmenu;mg.append(b)}}mini.append(mg);annual.append(mini)}}$('#list').append(card)});if(!data.habits.length)$('#list').innerHTML='<div class="empty">첫 번째 작은 실행을 추가해 보세요.</div>'}
function edit(h){$('#hid').value=h?.id||'';$('#name').value=h?.name||'';$('#desc').value=h?.desc||'';$('#goal').value=h?.goal||1;$('#color').value=h?.color||palette[data.habits.length%palette.length];$('#delete').hidden=!h;$('#dialogTitle').textContent=h?'작은 실행 수정':'새로운 작은 실행';$('#editor').showModal()}
$('#add').onclick=()=>edit();$('#cancel').onclick=()=>$('#editor').close();$('#form').onsubmit=e=>{e.preventDefault();let name=$('#name').value.trim();if(!name)return;let h=data.habits.find(h=>h.id===$('#hid').value);if(!h){h={id:crypto.randomUUID(),logs:{}};data.habits.push(h)}Object.assign(h,{name,desc:$('#desc').value.trim(),goal:+$('#goal').value,color:$('#color').value});$('#editor').close();save()};$('#delete').onclick=()=>{if(confirm('이 할 일과 누적 기록을 삭제할까요?')){data.habits=data.habits.filter(h=>h.id!==$('#hid').value);$('#editor').close();save()}};$('#year').onchange=()=>{selectedDates.clear();anchorDate=null;render()};$('#date').onchange=()=>{if(!$('#date').value||$('#date').value>now)$('#date').value=now;selectedDates=new Set([$('#date').value]);anchorDate=$('#date').value;$('#year').append(new Option($('#date').value.slice(0,4)+'년',$('#date').value.slice(0,4),true,true));render()};$('#today').onclick=()=>{$('#date').value=now;$('#date').onchange()};

document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{viewMode=b.dataset.view;render()});$('#clearSelection').onclick=()=>{selectedDates.clear();anchorDate=null;render()};function movePeriod(dir){let {start}=periodBounds(),step=viewMode==='month'?1:viewMode==='quarter'?3:12;start.setMonth(start.getMonth()+dir*step);$('#date').value=day(start);$('#year').append(new Option(start.getFullYear()+'년',start.getFullYear(),true,true));selectedDates.clear();anchorDate=null;render()}$('#prevPeriod').onclick=()=>movePeriod(-1);$('#nextPeriod').onclick=()=>movePeriod(1);
function download(content,name,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}$('#backup').onclick=()=>download(JSON.stringify(data,null,2),'작은실행_백업_'+now+'.json','application/json');$('#restore').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!valid(d))throw Error();if(confirm('현재 기록을 백업 파일의 기록으로 교체할까요?')){data=d;save();toast('백업을 불러왔어요.')}}catch{alert('올바른 작은 실행 백업 파일을 선택해 주세요.')}e.target.value=''};$('#portable').onclick=()=>{const doc=document.documentElement.cloneNode(true);doc.querySelector('#seed').textContent=JSON.stringify(data).replace(/</g,'\\u003c');doc.querySelector('dialog').removeAttribute('open');download('<!doctype html>'+doc.outerHTML,'작은실행_기록포함_'+now+'.html','text/html');toast('현재 기록을 담은 HTML을 저장했어요.')};save();
</script></html>
