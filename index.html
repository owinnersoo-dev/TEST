<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나의 자동차 점검상황표</title>
<style>
:root{--navy:#173b63;--blue:#2473ad;--bg:#eef3f7;--line:#d7e0e8;--red:#c83b48;--green:#23805c;--amber:#b97916;--ink:#17212b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit}.app{max-width:1100px;margin:auto;padding:18px 14px 90px}.hero{background:linear-gradient(135deg,#102f50,#287bb4);color:#fff;padding:24px 20px;border-radius:20px;box-shadow:0 10px 28px #173b6330}.hero h1{margin:0 0 6px;font-size:clamp(25px,6vw,38px)}.hero p{margin:0;opacity:.84}.vehicle,.toolbar,.summary{background:#fff;border-radius:16px;padding:14px;margin-top:14px;box-shadow:0 4px 18px #173b6310}.vehicle{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;font-size:12px;color:#617083;margin:0 0 5px}.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfdff}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center;padding:10px;border-radius:12px;background:#f5f8fb}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:#687789}.toolbar{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:8px;z-index:10}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;background:#e8eef4;color:#25435d}.btn.primary{background:var(--navy);color:#fff}.btn.danger{color:var(--red)}.cards{display:grid;gap:12px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:16px;padding:15px;box-shadow:0 4px 15px #173b630d}.card[data-status="교체 필요"]{border-left-color:var(--red)}.card[data-status="점검 필요"]{border-left-color:var(--amber)}.card[data-status="양호"]{border-left-color:var(--green)}.head{display:flex;gap:10px;align-items:center;margin-bottom:12px}.drag{font-size:23px;color:#8794a1;cursor:grab;touch-action:none}.name{font-size:19px;font-weight:800;border:0;border-bottom:1px dashed #bac7d2;min-width:0;flex:1;padding:5px}.badge{border-radius:99px;padding:6px 9px;background:#edf3f8;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.grid .wide{grid-column:span 2}.grid input,.grid select,.grid textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.grid textarea{min-height:65px;resize:vertical}.actions{display:flex;justify-content:flex-end;margin-top:9px}.empty{text-align:center;padding:40px;color:#718194}.foot{font-size:12px;color:#6d7b88;line-height:1.55;margin:18px 4px}.hidden{display:none}
@media(max-width:760px){.vehicle,.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.grid .wide{grid-column:span 2}.toolbar{overflow-x:auto;flex-wrap:nowrap}.btn{white-space:nowrap}.card{padding:13px 11px}.badge{font-size:11px}}
@media print{body{background:#fff}.app{max-width:none;padding:0}.toolbar,.actions,.foot{display:none}.hero{box-shadow:none}.card{break-inside:avoid;box-shadow:none}.vehicle,.summary{box-shadow:none}.cards{grid-template-columns:1fr}.field input,.grid input,.grid select,.grid textarea,.name{border:0;padding-left:0}.drag{display:none}}
</style></head>
<body><main class="app">
<section class="hero"><h1>🚘 나의 자동차 점검상황표</h1><p>최근 교체 기록부터 다음 점검 시점까지 한곳에서 관리하세요.</p></section>
<section class="vehicle">
 <div class="field"><label>차량명</label><input data-car="name" placeholder="예: LF 쏘나타"></div>
 <div class="field"><label>연식</label><input data-car="year" placeholder="예: 2014"></div>
 <div class="field"><label>차량번호</label><input data-car="number" placeholder="직접 입력"></div>
 <div class="field"><label>현재 주행거리(km)</label><input data-car="mileage" type="number" inputmode="numeric" placeholder="예: 138000"></div>
</section>
<section class="summary"><div class="stat"><b id="total">0</b><span>전체 항목</span></div><div class="stat"><b id="good">0</b><span>양호</span></div><div class="stat"><b id="check">0</b><span>점검 필요</span></div><div class="stat"><b id="replace">0</b><span>교체 필요</span></div></section>
<section class="toolbar"><button class="btn primary" id="add">＋ 항목 추가</button><button class="btn" id="sort">상태순 정렬</button><button class="btn" id="print">인쇄 / PDF</button><button class="btn" id="export">백업 저장</button><button class="btn" id="import">백업 불러오기</button><input id="file" class="hidden" type="file" accept="application/json"></section>
<section id="cards" class="cards"></section>
<p class="foot">※ 교체주기는 일반적인 참고값입니다. 차량 제조사 매뉴얼, 부품 상태, 운행 환경과 정비사의 점검 결과를 우선하세요. 입력 내용은 이 브라우저에 자동 저장됩니다.</p>
</main>
<template id="tpl"><article class="card" draggable="true"><div class="head"><span class="drag" title="끌어서 순서 변경">☰</span><input class="name" data-k="name"><span class="badge">상태</span></div><div class="grid">
 <div class="field"><label>최근 교체일</label><input type="date" data-k="lastDate"></div>
 <div class="field"><label>교체 당시 주행거리(km)</label><input type="number" inputmode="numeric" data-k="lastKm" placeholder="예: 135000"></div>
 <div class="field"><label>다음 교체 예정일</label><input type="date" data-k="nextDate"></div>
 <div class="field"><label>다음 교체 주행거리(km)</label><input type="number" inputmode="numeric" data-k="nextKm" placeholder="예: 145000"></div>
 <div class="field wide"><label>권장 교체주기</label><input data-k="cycle"></div>
 <div class="field"><label>현재 상태</label><select data-k="status"><option>미입력</option><option>양호</option><option>점검 필요</option><option>교체 필요</option><option>교체 완료</option></select></div>
 <div class="field"><label>정비 비용(원)</label><input type="number" inputmode="numeric" data-k="cost" placeholder="선택 입력"></div>
 <div class="field wide"><label>정비소 / 부품명</label><input data-k="shop" placeholder="예: ○○카센터 / 순정 부품"></div>
 <div class="field wide"><label>메모</label><textarea data-k="memo" placeholder="점검 결과, 이상 증상 등을 기록하세요"></textarea></div>
</div><div class="actions"><button class="btn danger remove">항목 삭제</button></div></article></template>
<script>
const KEY='myCarMaintenanceV1';
const defaults=[
 ['엔진오일','5,000~10,000km 또는 6~12개월'],['에어컨 필터','10,000~15,000km 또는 6~12개월'],['와이퍼','6~12개월'],['브레이크 패드','30,000~60,000km'],['브레이크 오일','2년 또는 약 40,000km'],['타이어','40,000~60,000km 또는 마모한계선 도달 시'],['배터리','3~5년'],['냉각수','40,000~100,000km 또는 2~5년'],['점화플러그','40,000~100,000km(차종·플러그 종류별 상이)'],['미션오일','60,000~100,000km(제조사 권장 확인 필수)']
].map((x,i)=>({id:Date.now()+i,name:x[0],cycle:x[1],lastDate:'',lastKm:'',nextDate:'',nextKm:'',status:'미입력',cost:'',shop:'',memo:''}));
let state={car:{name:'',year:'',number:'',mileage:''},items:defaults}; let dragged=null;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved?.items)state=saved}catch(e){}
const cards=document.querySelector('#cards'),tpl=document.querySelector('#tpl');
const totalEl=document.querySelector('#total'),goodEl=document.querySelector('#good'),checkEl=document.querySelector('#check'),replaceEl=document.querySelector('#replace');
const addBtn=document.querySelector('#add'),sortBtn=document.querySelector('#sort'),printBtn=document.querySelector('#print'),exportBtn=document.querySelector('#export'),importBtn=document.querySelector('#import'),fileInput=document.querySelector('#file');
function save(){localStorage.setItem(KEY,JSON.stringify(state));summary()}
function summary(){const n=s=>state.items.filter(x=>x.status===s).length;totalEl.textContent=state.items.length;goodEl.textContent=n('양호')+n('교체 완료');checkEl.textContent=n('점검 필요');replaceEl.textContent=n('교체 필요')}
function render(){cards.innerHTML='';state.items.forEach((item,index)=>{const el=tpl.content.firstElementChild.cloneNode(true);el.dataset.id=item.id;el.dataset.status=item.status;el.querySelectorAll('[data-k]').forEach(inp=>{inp.value=item[inp.dataset.k]??'';inp.addEventListener('input',()=>{item[inp.dataset.k]=inp.value;el.dataset.status=item.status;el.querySelector('.badge').textContent=item.status;save()})});el.querySelector('.badge').textContent=item.status;el.querySelector('.remove').onclick=()=>{if(confirm(`'${item.name}' 항목을 삭제할까요?`)){state.items.splice(index,1);save();render()}};el.ondragstart=()=>dragged=item.id;el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const from=state.items.findIndex(x=>x.id==dragged),to=state.items.findIndex(x=>x.id==item.id);if(from<0||to<0||from===to)return;const [m]=state.items.splice(from,1);state.items.splice(to,0,m);save();render()};cards.append(el)});summary()}
document.querySelectorAll('[data-car]').forEach(inp=>{inp.value=state.car[inp.dataset.car]||'';inp.oninput=()=>{state.car[inp.dataset.car]=inp.value;save()}});
addBtn.onclick=()=>{state.items.push({id:Date.now(),name:'새 점검 항목',cycle:'',lastDate:'',lastKm:'',nextDate:'',nextKm:'',status:'미입력',cost:'',shop:'',memo:''});save();render();setTimeout(()=>cards.lastElementChild.scrollIntoView({behavior:'smooth',block:'center'}),50)};
sortBtn.onclick=()=>{const order={'교체 필요':0,'점검 필요':1,'미입력':2,'양호':3,'교체 완료':4};state.items.sort((a,b)=>order[a.status]-order[b.status]);save();render()};printBtn.onclick=()=>window.print();
exportBtn.onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`자동차_점검상황표_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};
importBtn.onclick=()=>fileInput.click();fileInput.onchange=async()=>{try{const x=JSON.parse(await fileInput.files[0].text());if(!x.items)throw 0;state=x;save();location.reload()}catch(e){alert('올바른 백업 파일이 아닙니다.')}};
render();
</script></body></html>
